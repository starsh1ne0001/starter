[package]
name = "starter"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"

[dependencies]
eframe = { version = "0.36.2", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
global-hotkey = "0.8.0"
rfd = "0.17.2"
serde = { version = "1.0.229", features = ["derive"] }
sysinfo = "0.39.6"
toml = "1.1.8"

# The icon in the notification area, where there is one. Only pulled in on
# Windows: on Linux the crate wants a GTK main loop of its own, which is a
# different program's worth of arranging.
[target.'cfg(windows)'.dependencies]
tray-icon = "0.26.1"
# The console window Windows opens for a program it started itself, which has to
# be given back once the launcher outlives its window. See src/console.rs.
windows-sys = { version = "0.61", features = ["Win32_System_Console"] }
